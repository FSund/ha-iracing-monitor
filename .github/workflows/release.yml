name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.event.release.tag_name }}

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - name: Build
        run: cargo build --locked --release

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          # Anchored so a dependency's `name = ...` key can never match first.
          binary_name=$(grep -m1 '^name *=' Cargo.toml | cut -d '"' -f2)

          dirname="$binary_name-${VERSION}-linux"
          mkdir "$dirname"

          mv "target/release/$binary_name" "$dirname/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$dirname/"

          tar -czf "$dirname.tar.gz" "$dirname"
          echo "ASSET=$dirname.tar.gz" >> "$GITHUB_ENV"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: ${{ env.ASSET }}

  windows:
    name: Windows release
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Build
        run: cargo build --locked --release

      - name: Build archive
        run: |
          set -euo pipefail

          binary_name=$(grep -m1 '^name *=' Cargo.toml | cut -d '"' -f2)

          dirname="$binary_name-${VERSION}-windows-portable"
          mkdir "$dirname"

          cp "target/release/$binary_name.exe" "$dirname/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$dirname/"

          7z a "$dirname.zip" "$dirname"
          echo "ASSET=$dirname.zip" >> "$GITHUB_ENV"

      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.5

      - name: Create msi installer
        run: |
          set -euo pipefail

          # MSI ProductVersion must be strictly numeric: drop a leading "v" and
          # any SemVer build metadata (e.g. 0.4.2+c977bdd -> 0.4.2).
          msi_version="${VERSION#v}"
          msi_version="${msi_version%%+*}"
          msi_version="${msi_version%%-*}"

          wix extension add WixToolset.UI.wixext/4.0.5 WixToolset.Util.wixext/4.0.5
          wix build \
            -arch x64 \
            -ext WixToolset.UI.wixext \
            -ext WixToolset.Util.wixext \
            -d Version="$msi_version" \
            -out "./iracing-ha-monitor-${VERSION}-installer.msi" \
            "resources/windows/iracing_ha_monitor.wxs"

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.ASSET }}
            iracing-ha-monitor-${{ github.event.release.tag_name }}-installer.msi
